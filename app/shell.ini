[HomeUrl]
URL = https://statics.ets100.com/ets-student-pc-web/index.html

[ShellConfig]
FullScreen = 0
ShowTray = 0
# 1 = 启动即最大化。macOS 无边框窗口最大化后没有系统还原按钮，
# 表现为「窗口铺满屏幕、拖不动」，所以默认关掉（1180x780 居中显示）
WindowMaximize = 0
NoBorder = 1
UseShadow = 1
DragZoom = 0
AppTitle = 讯飞E听说
CloseApp = 0
AutoUpgrade = 0
MultiApp = 1
LaunchMode = 0
MsgSize = 50
LogLevel = 2
DisableGPU = 0
AllowInsecureContent = 1
# 0 = 允许页面在 https 里发 http 请求（联网自检需要），1 = 严格模式
WebSecurity = 0
# 伪装平台：留空=真实平台（实测伪装 Windows 无收益，保持空）
SpoofOS = Windows
ForceDeviceScale = 0
AppName = ETSMacShell

# 接口签名协议：v1（pid=grlx，裸 32 位 hex）或 v2（pid=pcWin，带 key_id=202608）
SignProtocol = v2

# 客户端版本号：页面会显示成「版本号 v5.7.9」，并与服务端做最低版本校验
# 取官方 Windows 安装包 EtsSetup5.7.9.exe 的版本，保持一致最稳
ClientVersion = 5.7.9
